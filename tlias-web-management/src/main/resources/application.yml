spring:
  application:
    name: tlias-web-management
  datasource:
    url: jdbc:mysql://localhost:3306/tlias
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234


  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 留空表示无密码，Spring Boot 会跳过 AUTH
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 1s

# ==================== 应用自定义配置 ====================
app:
  cache:
    # 缓存总开关：排障/压测时可置 false，直连数据库
    enabled: ${CACHE_ENABLED:true}
  auth:
    # 连续登录失败 N 次后锁定账号
    max-login-fail: 5
    # 锁定时长（分钟），同时也是失败计数 key 的过期时间
    lock-minutes: 15
  log:
    # 操作日志消费间隔（毫秒）
    consume-delay: 2000
    # 单批落库条数
    batch-size: 50

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java-ai-mww
    region: cn-beijing